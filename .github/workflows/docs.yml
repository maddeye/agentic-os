name: Docs

# Builds the site from doc/*.md and publishes it to GitHub Pages. A run takes
# about a minute, so unlike Tests it starts on its own.
on:
  push:
    branches: [main]
    paths:
      - doc/**
      - docs/assets/**
      - assets/icon.svg
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the site
        run: doc/site/build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
