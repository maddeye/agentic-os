# Sandbox for the native-restricted profile. doc/ISOLATION.md explains each group.
# @ROOT@ expands to the project directory and @UID@ to the project UID.

# Privilege
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictRealtime=yes
KeyringMode=private
RemoveIPC=yes
UMask=0077

# Host filesystem
ProtectSystem=strict
ProtectHome=yes
TemporaryFileSystem=/var/lib/agent-os:ro
BindPaths=@ROOT@
BindPaths=@ROOT@/tmp:/tmp
BindPaths=@ROOT@/tmp:/var/tmp
TemporaryFileSystem=/run
BindReadOnlyPaths=-/run/systemd/resolve
# The stub resolver listens on the host's loopback, which projects cannot reach.
BindReadOnlyPaths=-/run/systemd/resolve/resolv.conf:/run/systemd/resolve/stub-resolv.conf

# Network
NetworkNamespacePath=/run/netns/aos-@UID@
Requires=agentos-netns@@UID@.service
After=agentos-netns@@UID@.service

# Devices and shared memory
PrivateDevices=yes
TemporaryFileSystem=/dev/shm:mode=1777
PrivateIPC=yes

# Kernel
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
SystemCallArchitectures=native
SystemCallFilter=~@reboot @swap @module @raw-io @clock @obsolete @cpu-emulation

# Environment
Environment=HOME=@ROOT@/home
Environment=XDG_CACHE_HOME=@ROOT@/cache
Environment=XDG_STATE_HOME=@ROOT@/state
Environment=TMPDIR=/tmp
Environment=PATH=@ROOT@/home/.local/bin:/usr/local/bin:/usr/bin:/bin
WorkingDirectory=@ROOT@/workspace
